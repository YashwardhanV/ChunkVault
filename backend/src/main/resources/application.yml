spring:
  application:
    name: chunkvault
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chunkvault}
    username: ${DB_USERNAME:chunkvault}
    password: ${DB_PASSWORD:chunkvault}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:2GB}
      max-request-size: ${MAX_UPLOAD_SIZE:2GB}
      file-size-threshold: 0
      location: ${MULTIPART_TEMP_DIR:/tmp/chunkvault-multipart}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

chunkvault:
  storage-root: ${STORAGE_ROOT:./data/chunks}
  max-upload-bytes: ${MAX_UPLOAD_BYTES:2147483648}
  fixed-chunk-size: ${FIXED_CHUNK_SIZE:4194304}
  cdc-min-size: ${CDC_MIN_SIZE:1048576}
  cdc-target-size: ${CDC_TARGET_SIZE:4194304}
  cdc-max-size: ${CDC_MAX_SIZE:8388608}
  gc-grace-period: ${GC_GRACE_PERIOD:PT1H}
  verify-on-reuse: ${VERIFY_ON_REUSE:true}
  allowed-origin: ${ALLOWED_ORIGIN:http://localhost:3000}
